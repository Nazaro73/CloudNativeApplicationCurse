upstream backend-blue {
    server backend-blue:3000;
}

upstream backend-green {
    server backend-green:3000;
}

upstream frontend-blue {
    server frontend-blue:80;
}

upstream frontend-green {
    server frontend-green:80;
}

server {
    listen 80;
    server_name localhost;

    # Include active color configuration
    include /etc/nginx/conf.d/active-color.conf;

    # Frontend routing
    location / {
        set $frontend_upstream frontend-$active_color;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API routing
    location /api/ {
        set $backend_upstream backend-$active_color;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint
    location /health {
        set $backend_upstream backend-$active_color;
        proxy_pass http://$backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Status page to see active color
    location /status {
        default_type application/json;
        return 200 '{"active_color": "$active_color", "status": "ok"}';
    }
}

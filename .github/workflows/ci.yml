name: CI Pipeline

on:
  push:
    branches: [develop, main, feature/*]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Lint backend
        working-directory: ./backend
        run: npm run lint

  build:
    name: Build
    runs-on: self-hosted
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Generate Prisma client
        working-directory: ./backend
        run: npx prisma generate

  test:
    name: Tests
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Generate Prisma client
        working-directory: ./backend
        run: npx prisma generate

      - name: Run backend tests
        working-directory: ./backend
        run: npm test

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: self-hosted
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download and setup SonarScanner
        shell: powershell
        run: |
          $scannerVersion = "6.2.1.4610"
          $scannerUrl = "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$scannerVersion-windows-x64.zip"
          Invoke-WebRequest -Uri $scannerUrl -OutFile sonar-scanner.zip
          Expand-Archive -Path sonar-scanner.zip -DestinationPath . -Force
          "$PWD\sonar-scanner-$scannerVersion-windows-x64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: SonarCloud Scan
        shell: cmd
        working-directory: ./backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ..\sonar-scanner-6.2.1.4610-windows-x64\bin\sonar-scanner.bat -D"sonar.projectKey=Nazaro73_CloudNativeApplicationCurse" -D"sonar.organization=nazaro73" -D"sonar.sources=src" -D"sonar.host.url=https://sonarcloud.io" -D"sonar.token=%SONAR_TOKEN%"


  docker:
    name: Docker Build & Push
    runs-on: self-hosted
    needs: sonarcloud
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t backend-ci ./backend

      - name: Build frontend image
        run: docker build -t frontend-ci ./frontend

      - name: Test backend container
        shell: powershell
        run: |
          docker run -d --name backend-test -p 3001:3000 backend-ci
          Start-Sleep -Seconds 5
          $response = Invoke-WebRequest -Uri "http://localhost:3001/health" -UseBasicParsing
          if ($response.StatusCode -eq 200) {
            Write-Host "Backend healthcheck passed!"
          } else {
            Write-Host "Backend healthcheck failed!"
            exit 1
          }
          docker stop backend-test
          docker rm backend-test

      - name: Test frontend container
        shell: powershell
        run: |
          docker run -d --name frontend-test -p 8081:80 frontend-ci
          Start-Sleep -Seconds 3
          $response = Invoke-WebRequest -Uri "http://localhost:8081" -UseBasicParsing
          if ($response.StatusCode -eq 200) {
            Write-Host "Frontend healthcheck passed!"
          } else {
            Write-Host "Frontend healthcheck failed!"
            exit 1
          }
          docker stop frontend-test
          docker rm frontend-test

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push backend image
        run: |
          docker tag backend-ci ghcr.io/nazaro73/cloudnative-backend:${{ github.sha }}
          docker tag backend-ci ghcr.io/nazaro73/cloudnative-backend:latest
          docker push ghcr.io/nazaro73/cloudnative-backend:${{ github.sha }}
          docker push ghcr.io/nazaro73/cloudnative-backend:latest

      - name: Tag and push frontend image
        run: |
          docker tag frontend-ci ghcr.io/nazaro73/cloudnative-frontend:${{ github.sha }}
          docker tag frontend-ci ghcr.io/nazaro73/cloudnative-frontend:latest
          docker push ghcr.io/nazaro73/cloudnative-frontend:${{ github.sha }}
          docker push ghcr.io/nazaro73/cloudnative-frontend:latest

  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy application
        shell: powershell
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          Write-Host "Starting deployment with image tag: $env:IMAGE_TAG"

          # Stop existing containers (without removing volumes)
          Write-Host "Stopping existing containers..."
          docker compose -f docker-compose.prod.yml down

          # Pull latest images
          Write-Host "Pulling latest images..."
          docker pull ghcr.io/nazaro73/cloudnative-backend:$env:IMAGE_TAG
          docker pull ghcr.io/nazaro73/cloudnative-frontend:$env:IMAGE_TAG

          # Start containers with new images
          Write-Host "Starting containers..."
          docker compose -f docker-compose.prod.yml up -d

          # Wait for services to be ready
          Write-Host "Waiting for services to be ready..."
          Start-Sleep -Seconds 15

          # Run database migrations
          Write-Host "Running database migrations..."
          docker exec backend npx prisma migrate deploy

          # Verify deployment
          Write-Host "Verifying deployment..."
          docker ps --filter "name=postgres" --filter "name=backend" --filter "name=frontend"

          Write-Host "Deployment complete!"

services:
  backend-blue:
    image: ghcr.io/nazaro73/cloudnative-backend:${IMAGE_TAG:-latest}
    container_name: backend-blue
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-gym_db}
      PORT: 3000
      NODE_ENV: production
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend-blue:
    image: ghcr.io/nazaro73/cloudnative-frontend:${IMAGE_TAG:-latest}
    container_name: frontend-blue
    networks:
      - app-network
    depends_on:
      - backend-blue
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  app-network:
    external: true
    name: tp1_app-network

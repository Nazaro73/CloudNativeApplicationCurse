global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # NestJS Backend Blue
  - job_name: 'nest-backend-blue'
    static_configs:
      - targets: ['backend-blue:3000']
    metrics_path: /metrics
    scrape_interval: 10s

  # NestJS Backend Green
  - job_name: 'nest-backend-green'
    static_configs:
      - targets: ['backend-green:3000']
    metrics_path: /metrics
    scrape_interval: 10s
